<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lector de Patentes</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  padding:20px;
  font-family:Arial, Helvetica, sans-serif;
  background:#f2f2f2;
  text-align:center;
}

h2{
  margin-bottom:20px;
}

#video{
  width:100%;
  max-width:450px;
  border:3px solid #111;
  border-radius:12px;
  background:black;
}

#snap{
  margin-top:20px;
  padding:15px 25px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#111;
  color:white;
  cursor:pointer;
}

#snap:disabled{
  opacity:0.6;
}

#resultado{
  margin-top:25px;
  padding:20px;
  background:white;
  border-radius:12px;
  font-size:22px;
  font-weight:bold;
  min-height:70px;

  display:flex;
  align-items:center;
  justify-content:center;
}

</style>
</head>

<body>

<h2>🚘 Lector de Patentes</h2>

<video id="video" autoplay playsinline></video>

<br>

<button id="snap">
📸 Tomar Foto y Analizar
</button>

<div id="resultado">
Esperando captura...
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const resultado = document.getElementById('resultado');
const btnSnap = document.getElementById('snap');



// INICIAR CAMARA

async function iniciarCamara(){

  try{

    const stream = await navigator.mediaDevices.getUserMedia({
  video:{
    facingMode:{
      ideal:'environment'
    },

    width:{
      ideal:1280
    },

    height:{
      ideal:720
    }

  },

  audio:false
});

    video.srcObject = stream;

  }catch(err){

    console.error(err);

    resultado.innerText =
      '❌ Error al acceder a la cámara';

  }

}

iniciarCamara();




// BOTON FOTO

btnSnap.addEventListener('click', async ()=>{

  try{

    btnSnap.disabled = true;

    resultado.innerText =
      '⏳ Procesando imagen...';



    // CAPTURA

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext('2d');

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );



    // BASE64

    const base64Image = canvas
      .toDataURL('image/jpeg',0.5)
      .split(',')[1];



    // FETCH

    const response = await fetch(
      'https://script.google.com/macros/s/AKfycbykPyCSbGjQD1KZq9BjLnPncVMzg9181_QA4w00byrAk3wZXf5uKNj-_B3DduIMkxJB/exec',
      {
        method:'POST',

        mode:'cors',

        redirect:'follow',

        headers:{
          'Content-Type':'text/plain;charset=utf-8'
        },

        body: JSON.stringify({
          image: base64Image
        })

      }
    );



    // RESPUESTA

    const data = await response.json();



    if(data.ok){

      resultado.innerHTML =
        '✅ Patente Detectada:<br><span style="font-size:36px;">'
        + data.patente +
        '</span>';

    }else{

      resultado.innerText =
        '❌ Error: ' + data.error;

    }

  }catch(err){

    console.error(err);

    resultado.innerText =
      '❌ Error de conexión: ' + err;

  }

  btnSnap.disabled = false;

});

</script>

</body>
</html>
