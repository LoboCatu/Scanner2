<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lector de Patentes</title>
</head>
<body>
  <h2>Lector de Patentes</h2>
  <video id="video" autoplay playsinline style="width:100%; max-width:400px; border:2px solid black;"></video>
  <br>
  <button id="snap" style="padding:15px; font-size:18px;">Tomar Foto y Analizar</button>
  <div id="resultado" style="margin-top:20px; font-size:20px; font-weight:bold;"></div>
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const resultado = document.getElementById('resultado');
    const btnSnap = document.getElementById('snap');

    // Inicializar cámara
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => { video.srcObject = stream; })
      .catch(err => { resultado.innerText = "Error cámara: " + err; });

    // Lógica del botón
    btnSnap.addEventListener('click', () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      
      const base64Image = canvas.toDataURL('image/jpeg').split(',')[1];
      
      resultado.innerText = "Procesando con Gemini...";
      btnSnap.disabled = true; // Bloquea botón para evitar envíos dobles

      fetch("https://script.google.com/macros/s/AKfycbxfGgIDxgc1QgcalrU-QXglsGtxw6zT4WU8oR0SuDrrls8yAFTe9mMfw0lZHr7HvPnA/exec", {
method: 'POST',
      redirect: 'follow', // Esto ayuda a evitar el error de "interceptación"
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: base64Image })
    })
    .then(res => res.json())
      .then(data => {
        btnSnap.disabled = false;
        resultado.innerText = data.ok ? "Patente: " + data.patente : "Error: " + data.error;
      })
      .catch(err => { 
        btnSnap.disabled = false;
        resultado.innerText = "Error de conexión: " + err;
        console.error(err);
      });
    });
  </script>
</body>
</html>
