<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lector de Patentes</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#012b63;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card{
  width:90%;
  max-width:400px;
  background:rgba(255,255,255,0.08);
  padding:20px;
  border-radius:20px;
  text-align:center;
}

input{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:none;
  font-size:18px;
  margin-top:10px;
}

button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:none;
  border-radius:12px;
  background:#0d6efd;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.status{
  margin-top:10px;
  font-size:14px;
  opacity:0.8;
}
</style>
</head>

<body>

<div class="card">

  <h2>🚘 Lector de Patentes</h2>

  <input id="patente" placeholder="Patente detectada">

  <button onclick="abrirCamara()">📸 ESCANEAR PATENTE</button>

  <input type="file" id="camara" accept="image/*" capture="environment" style="display:none"
         onchange="procesarImagen(event)">

  <div class="status" id="status">Esperando acción...</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwp_bpFtVONamA-i4GtC51KNWYnic0FMYBCg_Vt6WGlYg8Cy8TrZqQFOC2ST_dbclW7/exec";

function abrirCamara(){
  document.getElementById("camara").click();
}

async function procesarImagen(event) {
    const file = event.target.files[0];
    if (!file) return;

    document.getElementById("status").innerText = "Procesando...";

    const reader = new FileReader();
    reader.onload = async function(e) {
        // Creamos un elemento imagen en memoria para redimensionar
        const img = new Image();
        img.onload = async () => {
            const canvas = document.createElement('canvas');
            // Limitamos el ancho a 800px para que la imagen sea ligera pero legible
            const maxW = 800;
            const scale = maxW / img.width;
            canvas.width = maxW;
            canvas.height = img.height * scale;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            // Convertimos la imagen procesada a base64 (calidad 0.7 para ahorrar espacio)
            const base64 = canvas.toDataURL('image/jpeg', 0.7).split(",")[1];

            try {
                // Aquí es donde se envía la imagen procesada a tu Google Apps Script
                const res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ image: base64 })
                });
                
                const data = await res.json();
                
                // Mostramos el resultado
                if (data.ok && data.patente) {
                    document.getElementById("patente").value = data.patente;
                    document.getElementById("status").innerText = "Patente detectada ✔";
                } else {
                    document.getElementById("status").innerText = "No se detectó patente";
                }
            } catch (e) {
                console.error(e);
                document.getElementById("status").innerText = "Error al conectar con el servidor";
            }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

</script>

</body>
</html>
